[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arden-vul-enhancer"
version = "1.0.0"
description = "Apply reviewed navigation and color highlights to an owner's Arden Vul PDF locally."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Arden Vul Enhancer contributors"}]
dependencies = ["PyMuPDF==1.26.6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.gui-scripts]
arden-vul-enhancer = "arden_vul_enhancer.gui:main"

[project.scripts]
arden-vul-enhancer-cli = "arden_vul_enhancer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arden_vul_enhancer*"]

[tool.setuptools.package-data]
arden_vul_enhancer = ["data/*.gz"]
